name: CI Pipeline

on:
  pull_request:
    branches: [ "dev" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew 테스트 빌드
      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew clean test

      # gradlew 빌드
      - name: Run tests
        run: |
          ./gradlew build -x test

      - name: Build with proto generation
        run: ./gradlew generateProto build -x test -x asciidoctor