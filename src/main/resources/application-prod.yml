server:
  port: 8083
spring:
  application:
    name: couponmoa
  ai:
    vertex:
      api-key: ${GOOGLE_API_KEY}
      model: gemini-2.5-flash
  data:
    elasticsearch:
      uris: ${ELASTIC_SEARCH_URL:http://elasticsearch:9200}
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  datasource:
    url: jdbc:mysql://${RDS_URL:jdbc:mysql://db:3306/couponmoa}
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    aws:
      region:
        static: ap-northeast-2
      stack:
        auto: false
      s3:
        bucket: couponmoa-coupon-prod
google:
  api:
    key: ${GOOGLE_API_KEY}
grpc:
  client:
    user-service:
      address: static://couponmoa-dev-user-service.couponmoa.local:6565
      negotiation-type: plaintext
    store-service:
      address: static://couponmoa-dev-store-service.couponmoa.local:6565
      negotiation-type: plaintext
  server:
    port: 6565